name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-archives:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux cross-compilation toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Compile static/release `garde` binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CC_x86_64_unknown_linux_musl=musl-gcc
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked -p gf-cli --bin garde --target "${{ matrix.target }}"

      - name: Package POSIX `.tar.gz` archive (0755 `garde`, 0644 docs for `mise`)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp "target/${{ matrix.target }}/release/garde" stage/garde
          cp README.md stage/README.md
          chmod 0755 stage/garde
          chmod 0644 stage/README.md
          tar -czf "dist/garde-${{ matrix.target }}.tar.gz" -C stage garde README.md

      - name: Package Windows `.zip` archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path stage, dist -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\garde.exe" "stage\garde.exe"
          Copy-Item "README.md" "stage\README.md"
          Compress-Archive -Path "stage\garde.exe", "stage\README.md" -DestinationPath "dist\garde-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/garde-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish-release:
    name: Attest & Publish GitHub Release
    needs: build-archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Generate `SHA256SUMS` and bundle installer scripts
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 release-assets/
          chmod 0644 release-assets/install.sh release-assets/install.ps1
          (
            cd release-assets
            sha256sum garde-* > SHA256SUMS
            sha256sum -c SHA256SUMS
            ls -lh
          )

      - name: Attest SLSA build provenance for release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/garde-*"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
