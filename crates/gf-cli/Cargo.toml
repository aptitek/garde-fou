[package]
name = "gf-cli"
description = "Command-line interface (`garde`) and structured reporters for Garde-fou"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/garde-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "garde"
path = "src/main.rs"

[lib]
name = "gf_cli"
path = "src/lib.rs"

[[test]]
name = "architecture"
path = "../../tests/architecture.rs"

[[test]]
name = "cli_smoke"
path = "../../tests/cli_smoke.rs"

[dependencies]
clap = { workspace = true }
gf-core = { workspace = true }
gf-engine = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gf-parsers = { workspace = true }
gf-rules = { workspace = true }

[lints]
workspace = true
