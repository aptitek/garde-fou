# Configuration dogfooding de Garde-fou (appliquée au dépôt lui-même)
schema_version = 1

[project]
name = "garde-fou"
languages = ["rust"]

[limits]
max_file_lines = 250
max_function_lines = 50
max_parameters = 4
max_cyclomatic_complexity = 10
max_cognitive_complexity = 10
max_nesting_depth = 4
max_imports_per_file = 15
max_methods_per_type = 10
min_clone_lines = 15
min_clone_nodes = 40
min_clone_similarity_pct = 85
max_struct_bools = 2

[rules]
forbid_unsafe = true
forbid_unwrap = true
forbid_expect = true
forbid_panic = true
forbid_todo = true
forbid_unimplemented = true
forbid_dbg = true
forbid_silent_error_swallow = true

[integrity]
require_lock = true

[[boundaries]]
from = "crates/gf-core/**"
deny = [
    "gf_rules",
    "gf_parsers",
    "gf_engine",
    "gf_cli",
    "crates/gf-rules/**",
    "crates/gf-parsers/**",
    "crates/gf-engine/**",
    "crates/gf-cli/**",
]
reason = "`gf-core` is the pure `#![no_std]` algebraic hub and must never depend on downstream crates."

[[boundaries]]
from = "crates/gf-rules/**"
deny = [
    "gf_parsers",
    "gf_engine",
    "gf_cli",
    "crates/gf-parsers/**",
    "crates/gf-engine/**",
    "crates/gf-cli/**",
]
reason = "`gf-rules` is the pure `#![no_std]` rule engine and may depend only on `gf-core`."

[[boundaries]]
from = "crates/gf-parsers/src/**"
deny = [
    "gf_rules",
    "gf_engine",
    "gf_cli",
    "crates/gf-rules/**",
    "crates/gf-engine/**",
    "crates/gf-cli/**",
]
reason = "`gf-parsers` is the pure I/O-free syntax bridge and may depend only on `gf-core`."

[clean_code]
max_nested_ternaries = 0
max_property_chain = 4
max_bool_parameters = 1
forbid_wildcard_exports = true
forbid_todos = true
forbid_single_impl_traits = true

[tdd]
forbid_assertion_free_tests = true

[commit]
allowed_types = [
    "feat",
    "fix",
    "refactor",
    "perf",
    "test",
    "docs",
    "build",
    "ci",
    "chore",
    "revert",
]
max_header_len = 100

[agents]
sync_policy = "required"
remote_skills = true

[scanners]
secrets = "required"
vulns = "required"

[paths]
ignore_paths = [".agents/**"]
entrypoints = [
    "crates/gf-cli/src/main.rs",
    "crates/*/src/lib.rs",
    "crates/*/tests/*.rs",
    "tests/*.rs",
]

[architecture]
no_std_crates = ["gf-core", "gf-rules"]
io_allowed_crates = ["gf-engine", "gf-cli"]
console_allowed_crates = ["gf-cli"]

[mutation]
min_mutation_score = 100

[cache]
enabled = true
directory = ".garde-fou-cache"
hash = "blake3"
