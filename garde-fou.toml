# Configuration dogfooding de Garde-fou (appliquée au dépôt lui-même)
schema_version = 1

[project]
name = "garde-fou"
languages = ["rust"]

[limits]
max_file_lines = 250
max_function_lines = 50
max_parameters = 4
max_cyclomatic_complexity = 10
max_cognitive_complexity = 10
max_nesting_depth = 4
max_imports_per_file = 15
max_methods_per_type = 10
min_clone_lines = 15
min_clone_nodes = 40
max_struct_bools = 2

[rules]
forbid_unsafe = true
forbid_unwrap = true
forbid_expect = true
forbid_panic = true
forbid_todo = true
forbid_unimplemented = true
forbid_dbg = true

[scanners]
secrets = "required"
vulns = "required"

[paths]
ignore_paths = [".agents/**"]
entrypoints = [
    "crates/gf-cli/src/main.rs",
    "crates/*/src/lib.rs",
    "crates/*/tests/*.rs",
    "tests/*.rs",
]

[architecture]
no_std_crates = ["gf-core", "gf-rules"]
io_allowed_crates = ["gf-engine", "gf-cli"]
console_allowed_crates = ["gf-cli"]

[cache]
enabled = true
directory = ".garde-fou-cache"
hash = "blake3"
